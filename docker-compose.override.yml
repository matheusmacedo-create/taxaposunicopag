# Configurações específicas para desenvolvimento
# Este arquivo é automaticamente carregado pelo docker-compose
version: '3.8'

services:
  frontend:
    # Sobrescrever configurações para desenvolvimento
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_HMR_PORT=5173
    volumes:
      # Montar código fonte para hot reload
      - .:/app
      # Preservar node_modules do container
      - /app/node_modules
      # Preservar cache do Vite
      - /app/.vite
      # Preservar cache do pnpm
      - /app/.pnpm-store
    ports:
      - "5173:5173"
    # Configurar para reiniciar automaticamente
    restart: unless-stopped
